<!DOCTYPE html>
<html lang="es" data-theme="dark">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=1024" />
  <title>Bitácora · Nehuel</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://cdn.jsdelivr.net" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js" defer></script>
</head>
<body>
  <!-- ========================================================== -->
  <!-- LAYOUT: sidebar + main                                     -->
  <!-- ========================================================== -->
  <div class="app">

    <!-- =============== SIDEBAR =============== -->
    <aside class="sidebar" aria-label="Navegación principal">
      <div class="sidebar-header">
        <div class="brand">
          <div class="brand-icon" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="7" height="7" rx="2"/>
              <rect x="14" y="3" width="7" height="7" rx="2"/>
              <rect x="3" y="14" width="7" height="7" rx="2"/>
              <rect x="14" y="14" width="7" height="7" rx="2"/>
            </svg>
          </div>
          <div class="brand-text">
            <div class="brand-name">Bitácora</div>
            <div class="brand-sub">Alvaro · Nehuel</div>
          </div>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-route="dashboard">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 13l9-9 9 9M5 11v9h4v-6h6v6h4v-9"/>
            </svg>
          </span>
          <span>Dashboard</span>
        </button>
        <button class="nav-item" data-route="log">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M4 6h16M4 12h16M4 18h10"/>
            </svg>
          </span>
          <span>Bitácora</span>
        </button>
        <button class="nav-item" data-route="pending">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="9"/>
              <path d="M12 7v5l3 2"/>
            </svg>
          </span>
          <span>Pendientes</span>
          <span class="nav-badge" id="nav-pending-count" hidden>0</span>
        </button>
        <button class="nav-item" data-route="insights">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M3 3v18h18M7 14l4-4 3 3 5-6"/>
            </svg>
          </span>
          <span>Insights</span>
        </button>
        <button class="nav-item" data-route="templates">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M13 2L3 14h7l-1 8 10-12h-7l1-8z"/>
            </svg>
          </span>
          <span>Plantillas</span>
        </button>
        <button class="nav-item" data-route="settings">
          <span class="nav-icon">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="12" cy="12" r="3"/>
              <path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 0 1-4 0v-.1a1.7 1.7 0 0 0-1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 0 1 0-4h.1a1.7 1.7 0 0 0 1.5-1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3h.1a1.7 1.7 0 0 0 1-1.5V3a2 2 0 0 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8v.1a1.7 1.7 0 0 0 1.5 1H21a2 2 0 0 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>
            </svg>
          </span>
          <span>Ajustes</span>
        </button>
      </nav>

      <div class="sidebar-footer">
        <button id="quick-add-btn" class="btn-primary btn-block">
          <span class="plus-icon">+</span>
          Nueva tarea
          <kbd>⌘N</kbd>
        </button>
        <div class="sync-status" id="sync-status">
          <span class="dot dot-offline"></span>
          <span class="sync-text">Sin conectar</span>
        </div>
      </div>
    </aside>

    <!-- =============== MAIN =============== -->
    <main class="main" id="main">
      <!-- Topbar -->
      <header class="topbar">
        <div class="topbar-left">
          <h1 class="page-title" id="page-title">Dashboard</h1>
          <p class="page-sub" id="page-sub">Resumen general</p>
        </div>
        <div class="topbar-right">
          <div class="search-wrap">
            <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <circle cx="11" cy="11" r="7"/>
              <path d="M21 21l-4.3-4.3"/>
            </svg>
            <input type="text" id="global-search" placeholder="Buscar tarea..." />
            <kbd>⌘K</kbd>
          </div>
        </div>
      </header>

      <!-- View container -->
      <div class="view" id="view"></div>
    </main>
  </div>

  <!-- ========================================================== -->
  <!-- MODALS                                                     -->
  <!-- ========================================================== -->
  <div class="modal-backdrop" id="modal-backdrop" hidden>
    <div class="modal-sheet" id="modal-sheet" role="dialog" aria-modal="true">
      <div class="modal-handle"></div>
      <div class="modal-header">
        <h2 id="modal-title">Nueva tarea</h2>
        <button class="modal-close" id="modal-close" aria-label="Cerrar">×</button>
      </div>
      <div class="modal-body" id="modal-body"></div>
    </div>
  </div>

  <!-- Toast notifications -->
  <div class="toast-stack" id="toast-stack"></div>

  <!-- ========================================================== -->
  <!-- SCRIPTS                                                    -->
  <!-- ========================================================== -->
  <script type="module" src="js/app.js"></script>
</body>
</html>
